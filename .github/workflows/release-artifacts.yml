name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build/publish (e.g. v1.0.9)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name || github.event.inputs.release_tag }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
  DEVID_SOURCE_TAG: "v1.0.0"
  DEVID_SOURCE_ASSET: "devid-android-websdk-v4.6.7.zip"
  DEVID_SOURCE_SHA256: "32276a0e8dcceacd7267b29c614936834e085f33eb10ea3cb14a374b136af559"

jobs:
  checks:
    uses: ./.github/workflows/release-checks.yml
    with:
      release_tag: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}

  prepare:
    name: Node tests, WebUI and verified SDK
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate tag and derive platform matrix
        id: targets
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "targets=$(bash scripts/release-targets.sh --json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Node tests and shared WebUI build
        run: |
          npm ci --prefix webui --prefer-offline --no-audit
          ./tests/scripts/run-unit-node.sh
          npm run build --prefix webui
          mkdir -p .tmp/release-inputs
          tar -czf .tmp/release-inputs/webui.tar.gz static/admin
      - name: Prepare verified bundled devid resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/sdk-source
          gh release download "$DEVID_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$DEVID_SOURCE_ASSET" --dir .tmp/sdk-source
          printf '%s  %s\n' "$DEVID_SOURCE_SHA256" ".tmp/sdk-source/$DEVID_SOURCE_ASSET" | sha256sum --check
          python3 scripts/install-devid-assets.py ".tmp/sdk-source/$DEVID_SOURCE_ASSET" --assets-dir .tmp/sdk-source/verified
          python3 scripts/build-android-devid.py --assets .tmp/sdk-source/verified --output ".tmp/release-inputs/devid-android-websdk_${RELEASE_TAG}.zip"
          python3 scripts/install-devid-assets.py ".tmp/release-inputs/devid-android-websdk_${RELEASE_TAG}.zip" --assets-dir .tmp/devid-assets
          tar -C .tmp/devid-assets -czf .tmp/release-inputs/devid-assets.tar.gz \
            fp-1.min.js gpus.json patches.json profiles.json verify.js public_key \
            browser_env.js fonts.json ANDROID-PACKAGE.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: .tmp/release-inputs/*
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  archives:
    name: Archive (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache Go modules and toolchains
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-release-modules-${{ hashFiles('go.sum', 'proxybridge/go.sum') }}
      - name: Cache platform compilation
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-release-build-${{ matrix.target }}-${{ hashFiles('go.sum', 'proxybridge/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-release-build-${{ matrix.target }}-${{ hashFiles('go.sum', 'proxybridge/go.sum') }}-
            ${{ runner.os }}-release-build-${{ matrix.target }}-
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: .tmp/release-inputs
      - name: Build one platform using shared WebUI
        env:
          TARGET_LABEL: ${{ matrix.target }}
          RELEASE_BUILD_JOBS: "1"
        run: |
          tar -xzf .tmp/release-inputs/webui.tar.gz
          ./scripts/build-release-archives.sh --target "$TARGET_LABEL"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish archives and Docker images
    needs: [checks, prepare, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: .tmp/release-inputs
      - name: Restore verified SDK inputs
        run: |
          mkdir -p dist/docker-input
          cp .tmp/release-inputs/devid-android-websdk_*.zip dist/
          cp .tmp/release-inputs/devid-assets.tar.gz dist/docker-input/
      - name: Upload binary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > sha256sums.txt)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip dist/sha256sums.txt --clobber
          else
            gh release create "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip dist/sha256sums.txt --title "${RELEASE_TAG}" --notes ""
          fi

      - name: Prepare Docker release inputs
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          mkdir -p dist/docker-input
          cp "dist/ds2api_${TAG}_linux_amd64.tar.gz" "dist/docker-input/linux_amd64.tar.gz"
          cp "dist/ds2api_${TAG}_linux_arm64.tar.gz" "dist/docker-input/linux_arm64.tar.gz"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Wait for GHCR endpoint
        run: |
          set -euo pipefail
          for i in {1..6}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://ghcr.io/v2/ || true)"
            if [ "${code}" = "200" ] || [ "${code}" = "401" ] || [ "${code}" = "405" ]; then
              exit 0
            fi
            sleep "$((i * 10))"
          done
          echo "GHCR endpoint is unreachable after multiple retries (last status: ${code:-unknown})." >&2
          exit 1

      - name: Log in to GHCR (with retry)
        run: |
          set -euo pipefail
          for i in {1..6}; do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              exit 0
            fi
            sleep "$((i * 10))"
          done
          echo "Failed to login to GHCR after multiple retries." >&2
          exit 1

      - name: Extract Docker metadata
        id: meta_release
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ./Dockerfile
          target: runtime-with-devid-from-dist
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image contains working devid
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}"
          docker pull --platform linux/amd64 "${IMAGE}"
          docker run --rm --entrypoint sh "${IMAGE}" -c \
            'test "$(id -u)" -ne 0 && test -w "$DS2API_DEVID_STATE_DIR" && node /app/scripts/devid-generate.cjs --selftest --timeout 30'

      - name: Export Docker image archives for release assets
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"

          docker buildx build \
            --platform linux/amd64 \
            --target runtime-with-devid-from-dist \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}" \
            --cache-from type=gha \
            --output type=docker,dest="dist/ds2api_${TAG}_docker_linux_amd64.tar" \
            .

          docker buildx build \
            --platform linux/arm64 \
            --target runtime-with-devid-from-dist \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}" \
            --cache-from type=gha \
            --output type=docker,dest="dist/ds2api_${TAG}_docker_linux_arm64.tar" \
            .

          gzip -f "dist/ds2api_${TAG}_docker_linux_amd64.tar"
          gzip -f "dist/ds2api_${TAG}_docker_linux_arm64.tar"

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > sha256sums.txt)

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          FILES=(
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" --title "${TAG}" --notes ""
          fi
