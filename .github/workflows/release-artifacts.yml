name: Release Artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build/publish (e.g. v2.1.6)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name || github.event.inputs.release_tag }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"
  DEVID_SOURCE_TAG: "v1.0.0"
  DEVID_SOURCE_ASSET: "devid-android-websdk-v4.6.7.zip"
  DEVID_SOURCE_SHA256: "32276a0e8dcceacd7267b29c614936834e085f33eb10ea3cb14a374b136af559"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            proxybridge/go.sum

      - name: Install golangci-lint
        run: |
          mkdir -p "$RUNNER_TEMP/golangci-lint-bin"
          GOBIN="$RUNNER_TEMP/golangci-lint-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci --prefix webui --prefer-offline --no-audit

      - name: Release Blocking Gates
        env:
          GOLANGCI_LINT_BIN: ${{ runner.temp }}/golangci-lint-bin/golangci-lint
        run: |
          ./scripts/lint.sh
          ./tests/scripts/check-refactor-line-gate.sh
          ./tests/scripts/run-unit-all.sh

      - name: Build WebUI
        run: npm run build --prefix webui

      - name: Build Multi-Platform Archives
        env:
          RELEASE_BUILD_JOBS: "3"
        run: ./scripts/build-release-archives.sh

      - name: Prepare verified bundled devid resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/sdk-source dist/docker-input
          gh release download "${DEVID_SOURCE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${DEVID_SOURCE_ASSET}" --dir dist/sdk-source
          printf '%s  %s\n' "${DEVID_SOURCE_SHA256}" "dist/sdk-source/${DEVID_SOURCE_ASSET}" | sha256sum --check
          python3 scripts/install-devid-assets.py "dist/sdk-source/${DEVID_SOURCE_ASSET}" --assets-dir dist/sdk-source/verified
          python3 scripts/build-android-devid.py --assets dist/sdk-source/verified --output "dist/devid-android-websdk_${RELEASE_TAG}.zip"
          python3 scripts/install-devid-assets.py "dist/devid-android-websdk_${RELEASE_TAG}.zip" --assets-dir dist/devid-assets
          tar -C dist/devid-assets -czf dist/docker-input/devid-assets.tar.gz \
            fp-1.min.js gpus.json patches.json profiles.json verify.js public_key \
            browser_env.js fonts.json ANDROID-PACKAGE.json

      - name: Upload binary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > sha256sums.txt)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip dist/sha256sums.txt --clobber
          else
            gh release create "${RELEASE_TAG}" dist/*.tar.gz dist/*.zip dist/sha256sums.txt --title "${RELEASE_TAG}" --notes ""
          fi

      - name: Prepare Docker release inputs
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          mkdir -p dist/docker-input
          cp "dist/ds2api_${TAG}_linux_amd64.tar.gz" "dist/docker-input/linux_amd64.tar.gz"
          cp "dist/ds2api_${TAG}_linux_arm64.tar.gz" "dist/docker-input/linux_arm64.tar.gz"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Wait for GHCR endpoint
        run: |
          set -euo pipefail
          for i in {1..6}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://ghcr.io/v2/ || true)"
            if [ "${code}" = "200" ] || [ "${code}" = "401" ] || [ "${code}" = "405" ]; then
              exit 0
            fi
            sleep "$((i * 10))"
          done
          echo "GHCR endpoint is unreachable after multiple retries (last status: ${code:-unknown})." >&2
          exit 1

      - name: Log in to GHCR (with retry)
        run: |
          set -euo pipefail
          for i in {1..6}; do
            if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
              exit 0
            fi
            sleep "$((i * 10))"
          done
          echo "Failed to login to GHCR after multiple retries." >&2
          exit 1

      - name: Extract Docker metadata
        id: meta_release
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ./Dockerfile
          target: runtime-with-devid-from-dist
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image contains working devid
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}"
          docker pull --platform linux/amd64 "${IMAGE}"
          docker run --rm --entrypoint sh "${IMAGE}" -c \
            'test "$(id -u)" -ne 0 && test -w "$DS2API_DEVID_STATE_DIR" && node /app/scripts/devid-generate.cjs --selftest --timeout 30'

      - name: Export Docker image archives for release assets
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"

          docker buildx build \
            --platform linux/amd64 \
            --target runtime-with-devid-from-dist \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}" \
            --cache-from type=gha \
            --output type=docker,dest="dist/ds2api_${TAG}_docker_linux_amd64.tar" \
            .

          docker buildx build \
            --platform linux/arm64 \
            --target runtime-with-devid-from-dist \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}" \
            --cache-from type=gha \
            --output type=docker,dest="dist/ds2api_${TAG}_docker_linux_arm64.tar" \
            .

          gzip -f "dist/ds2api_${TAG}_docker_linux_amd64.tar"
          gzip -f "dist/ds2api_${TAG}_docker_linux_arm64.tar"

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip > sha256sums.txt)

      - name: Validate release tag
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [ -z "${TAG}" ]; then
            echo "release tag is empty; set release_tag when using workflow_dispatch." >&2
            exit 1
          fi

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          FILES=(
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" --title "${TAG}" --notes ""
          fi
